        const x = startX + i*charW;
        const selected = i === this.nameCursor;
        this.rect(x-8, y-12, 16, 18, PAL.darkest);
        this.rect(x-7, y-11, 14, 16, selected ? PAL.dark : PAL.lightest);
        ctx.fillStyle = selected ? PAL.lightest : PAL.darkest;
        ctx.font = "11px monospace";
        ctx.fillText(ch, x, y+2);
        if(selected && Math.floor(this.msgClock*2.5)%2===0){
          ctx.fillStyle = PAL.darkest;
          ctx.font = "8px monospace";
          ctx.fillText("▲", x, y-16);
        }
      });

      ctx.fillStyle = PAL.darkest;
      ctx.font = "6px monospace";
      ctx.fillText("↑↓ BYT TECKEN · ←→ FLYTTA", W/2, 108);
      if(Math.floor(this.msgClock*2)%2===0){
        ctx.font = "7px monospace";
        ctx.fillText("TRYCK START = KLAR", W/2, 124);
      }
    }
    drawHighscoreList(){
      this.rect(0,0,W,H, PAL.lightest);
      const ctx = this.ctx;
      ctx.textAlign='center';
      ctx.fillStyle = PAL.darkest;
      ctx.font = "10px monospace";
      ctx.fillText("HIGHSCORE", W/2, 12);

      // Två flikar - en per spelläge - för att välja vilken topp 10-tabell som visas.
      const tabs = [
        {id:'classic',    label:'KLASSISKT'},
        {id:'timeattack', label:'TID-UTMANING'}
      ];
      const tabY = 16, tabH = 12, tabW = 74, gap = 4;
      const tabStartX = W/2 - (tabW*2+gap)/2;
      tabs.forEach((tab,i)=>{
        const x = tabStartX + i*(tabW+gap);
        const active = this.highscoreViewMode === tab.id;
        this.rect(x, tabY, tabW, tabH, PAL.darkest);
        this.rect(x+1, tabY+1, tabW-2, tabH-2, active ? PAL.dark : PAL.lightest);
        ctx.fillStyle = active ? PAL.lightest : PAL.darkest;
        ctx.font = "5px monospace";
        ctx.fillText(tab.label, x+tabW/2, tabY+8);
      });

      // Global lista (Firestore) om den finns laddad, annars den lokala
      // offline-cachen som fallback, med en liten statusrad som förklarar
      // vilken av de två som visas just nu.
      const online = this.onlineHighscores[this.highscoreViewMode];
      const usingOnline = online.status === 'loaded';
      const list = usingOnline ? online.list : (this.highscores[this.highscoreViewMode] || []);

      ctx.textAlign='center';
      ctx.font = "5px monospace";
      ctx.fillStyle = PAL.dark;
      if(online.status === 'loading'){
        ctx.fillText("HÄMTAR GLOBAL LISTA...", W/2, 34);
      } else if(online.status === 'error'){
        ctx.fillText("OFFLINE – VISAR LOKAL LISTA", W/2, 34);
      } else if(usingOnline){
        ctx.fillText("GLOBAL TOPP "+MAX_HIGHSCORES, W/2, 34);
      } else {
        ctx.fillText("LOKAL LISTA", W/2, 34);
      }

      if(list.length === 0){
        ctx.fillStyle = PAL.darkest;
        ctx.font = "7px monospace";
        ctx.fillText("INGA RESULTAT ÄNNU", W/2, 76);
      } else {
        const rowH = 10;
        list.slice(0, MAX_HIGHSCORES).forEach((entry,i)=>{
          const y = 44 + i*rowH;
          ctx.textAlign='left';
          ctx.font = "6px monospace";
          ctx.fillStyle = PAL.darkest;
          ctx.fillText((i+1)+". "+entry.name, 10, y);
          ctx.textAlign='right';
          ctx.font = "5px monospace";
          ctx.fillText("R"+entry.round, W-10, y);
        });
      }

      ctx.textAlign='center';
      if(Math.floor(this.msgClock*2)%2===0){
        ctx.fillStyle = PAL.darkest;
        ctx.font = "6px monospace";
        ctx.fillText("←→/SEL = BYT · A = TILLBAKA", W/2, 140);
      }
    }
    drawConfirmQuit(){
      // Frusen spelscen i bakgrunden så man ser vad man är på väg att överge.
      this.drawScene();
      this.drawHUD();
      const ctx = this.ctx;
      this.rect(14,44,132,60, PAL.darkest);
      this.rect(16,46,128,56, PAL.lightest);
      ctx.textAlign='center';
      ctx.fillStyle = PAL.darkest;
      ctx.font = "8px monospace";
      ctx.fillText("ÖVERGE RUNDAN?", W/2, 58);
      ctx.font = "6px monospace";
      ctx.fillText("FRAMSTEGET GÅR FÖRLORAT", W/2, 68);

      const optW = 44, optH = 16, gap = 8;
      const totalW = optW*2+gap;
      const startX = W/2 - totalW/2;
      const y = 78;
      [{label:'NEJ', idx:0},{label:'JA', idx:1}].forEach((o,i)=>{
        const x = startX + i*(optW+gap);
        const selected = this.confirmIndex === o.idx;
        this.rect(x, y, optW, optH, PAL.darkest);
        this.rect(x+1, y+1, optW-2, optH-2, selected ? PAL.dark : PAL.lightest);
        ctx.fillStyle = selected ? PAL.lightest : PAL.darkest;
        ctx.font = "8px monospace";
        ctx.fillText(o.label, x+optW/2, y+11);
      });

      if(Math.floor(this.msgClock*2)%2===0){
        ctx.fillStyle = PAL.darkest;
        ctx.font = "6px monospace";
        ctx.fillText("←→ VÄLJ · A BEKRÄFTA", W/2, 122);
      }
    }

    // ---- online-duell: skärmar för att skapa/gå med i rum och spela matchen ----
    drawRoomCodeEntry(){
      this.rect(0,0,W,H, PAL.lightest);
      const ctx = this.ctx;
      ctx.textAlign='center';
      ctx.fillStyle = PAL.darkest;
      ctx.font = "11px monospace";
      ctx.fillText("GÅ MED I RUM", W/2, 22);
      ctx.font = "5px monospace";
      ctx.fillText("ANGE RUMSKODEN FRÅN DIN VÄN", W/2, 34);

      const charW = 26;
      const totalW = this.roomChars.length*charW;
      const startX = W/2 - totalW/2 + charW/2;
      const y = 74;
      this.roomChars.forEach((ch,i)=>{
        const x = startX + i*charW;
        const selected = i === this.roomCursor;
        this.rect(x-10, y-14, 20, 22, PAL.darkest);
        this.rect(x-9, y-13, 18, 20, selected ? PAL.dark : PAL.lightest);
        ctx.fillStyle = selected ? PAL.lightest : PAL.darkest;
        ctx.font = "13px monospace";
        ctx.fillText(ch, x, y+3);
        if(selected && Math.floor(this.msgClock*2.5)%2===0){
          ctx.fillStyle = PAL.darkest;
          ctx.font = "8px monospace";
          ctx.fillText("▲", x, y-18);
        }
      });

      ctx.fillStyle = PAL.darkest;
      ctx.font = "6px monospace";
      ctx.fillText("↑↓ BYT TECKEN · ←→ FLYTTA", W/2, 108);
      if(Math.floor(this.msgClock*2)%2===0){
        ctx.font = "7px monospace";
        ctx.fillText("TRYCK START = ANSLUT", W/2, 124);
      }
      ctx.font = "5px monospace";
      ctx.fillText("MENU = TILLBAKA", W/2, 136);
    }
    drawRoomBusy(){
      this.rect(0,0,W,H, PAL.lightest);
      const ctx = this.ctx;
      ctx.textAlign='center';
      ctx.fillStyle = PAL.darkest;
      const dots = '.'.repeat(1 + Math.floor(this.msgClock*2) % 3);
      ctx.font = "8px monospace";
      ctx.fillText(this.roomBusyText.replace('...', '') + dots, W/2, H/2);
    }
    drawOnlineLobby(){
      this.rect(0,0,W,H, PAL.lightest);
      const ctx = this.ctx;
      ctx.textAlign='center';
      ctx.fillStyle = PAL.darkest;
      ctx.font = "9px monospace";
      ctx.fillText("RUM SKAPAT!", W/2, 20);
      ctx.font = "5px monospace";
      ctx.fillText("DELA DEN HÄR KODEN MED EN VÄN:", W/2, 32);

      this.rect(W/2-46, 44, 92, 34, PAL.darkest);
      this.rect(W/2-44, 46, 88, 30, PAL.lightest);
      ctx.fillStyle = PAL.darkest;
      ctx.font = "18px monospace";
      ctx.fillText(this.roomCode || '----', W/2, 68);

      ctx.fillStyle = PAL.darkest;
      if(Math.floor(this.msgClock*2)%2===0){
        ctx.font = "7px monospace";
        ctx.fillText("VÄNTAR PÅ SPELARE 2...", W/2, 96);
      }
      ctx.font = "6px monospace";
      ctx.fillText("MENU = AVBRYT", W/2, 130);
    }
    drawRoomJoinError(){
      this.rect(0,0,W,H, PAL.darkest);
      const ctx = this.ctx;
      ctx.textAlign='center';
      ctx.fillStyle = PAL.light;
      ctx.font = "9px monospace";
      const text = this.roomJoinStatus === 'notfound' ? 'RUM HITTADES EJ'
        : this.roomJoinStatus === 'full' ? 'RUMMET ÄR FULLT'
        : 'ANSLUTNINGSFEL';
      ctx.fillText(text, W/2, 64);
      ctx.font = "5px monospace";
      ctx.fillText('KONTROLLERA KODEN OCH FÖRSÖK IGEN', W/2, 78);
      if(Math.floor(this.msgClock*2)%2===0){
        ctx.font = "7px monospace";
        ctx.fillText("TRYCK A = TILLBAKA", W/2, 100);
      }
    }
    // Spektatorvy medan motståndaren har turen - spelplanen speglas direkt
    // ur det delade rumstillståndet (this.kubbs/this.phase/this.batons, se
    // onRoomUpdate), så drawScene/drawHUD återanvänds helt oförändrade.
    drawOnlineWait(){
      if(this.throwAnim) this.drawThrowAnim();
      else { this.drawScene(); this.drawHUD(); }
      this.drawMessage();
      const ctx = this.ctx;
      ctx.textAlign='center';
      if(Math.floor(this.msgClock*2)%2===0){
        ctx.fillStyle = PAL.darkest;
        ctx.font = "7px monospace";
        ctx.fillText("MOTSTÅNDARENS TUR...", W/2, 138);
      }
    }
    drawOnlineRoundResult(){
      const ctx = this.ctx;
      const winner = this.room ? this.room.winner : null;
      const won = winner === this.localRole;
      const draw = winner === 'draw';
      this.rect(0,0,W,H, draw ? PAL.darkest : (won ? PAL.lightest : PAL.darkest));
      ctx.textAlign='center';
      ctx.font = "14px monospace";
      ctx.fillStyle = draw ? PAL.light : (won ? PAL.darkest : PAL.light);
      ctx.fillText(draw ? 'OAVGJORT' : (won ? 'DU VANN!' : 'DU FÖRLORADE'), W/2, 60);
      ctx.font = "6px monospace";
      if(this.room && this.room.message){
        ctx.fillText(this.room.message, W/2, 78);
      }
      if(Math.floor(this.msgClock*2)%2===0){
        ctx.font = "7px monospace";
        ctx.fillText("TRYCK START = MENY", W/2, 106);
      }
    }

    // ---- huvudloop ----
    loop(now){
      let dt = (now-this.last)/1000; this.last = now;
      dt = Math.min(dt, 0.05);
      this.msgClock += dt;
      if(this.msgTimer>0) this.msgTimer -= dt;
      if(this.shake>0) this.shake = Math.max(0, this.shake-dt*40);
      if(this.flash>0) this.flash = Math.max(0, this.flash-dt);

      // Tid-utmaningens klocka ticker bara medan ett kast faktiskt pågår -
      // inte i menyn, mellan rundor eller på game over-skärmen. Gäller bara
      // lokalt läge - matchType==='online' återanvänder 'aim'/'power'/'throw'
      // men har ingen tidsgräns, så den här klockan får aldrig röra sig då.
      if(this.matchType !== 'online' && this.gameMode === 'timeattack' && ACTIVE_STATES.has(this.state)){
        this.timeLeft = Math.max(0, this.timeLeft - dt);
        if(this.timeLeft <= 0){
          this.message = 'TIDEN UTGICK!';
          this.msgTimer = 1.4;
          this.audio.sfxOver();
          this.endGame();
        }
      }

      const ctx = this.ctx;
      ctx.save();
      if(this.shake>0) ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);

      if(this.isKingThrowNow()){
        // Specialkastet: skärmen vänds upp och ned för att simulera att
        // spelaren kastar bakåt mellan benen med ryggen mot kungen.
        ctx.translate(W, H);
        ctx.rotate(Math.PI);
      }

      // Fiskmåsen flyger fritt medan man siktar och väljer kraft - det är i
      // exakta ögonblicket man låser kraften (och kastet avfyras) som
      // hennes position "fryses" för träff-kollisionen. Det gör att det är
      // TIMINGEN på kraft-tryckningen som avgör om man råkar sikta rätt in i
      // henne, inte vad hon sedan hinner göra under själva kastanimationen.
      if(this.matchType !== 'online' && (this.state === 'aim' || this.state === 'power')){
        this.updateSeagull(dt);
      }

      if(this.state === 'menu'){
        this.drawMenu(this.msgClock);
      } else if(this.state === 'aim'){
        this.aimT += dt*this.aimSpeed;
        this.aimX = 80 + Math.sin(this.aimT)*60;
        this.drawAim();
        this.drawMessage();
      } else if(this.state === 'power'){
        this.powerT += dt*this.powerSpeed;
        this.powerVal = 50 - 50*Math.cos(this.powerT);
        this.drawPower();
        this.drawMessage();
      } else if(this.state === 'throw'){
        this.throwAnim.t += dt;
        this.throwAnim.rot += dt*30;
        if(this.matchType !== 'online') this.checkSeagullThrowCollision();
        if(this.state === 'throw'){
          this.drawThrowAnim();
          if(this.throwAnim.t >= this.throwAnim.dur){
            if(this.matchType === 'online') this.resolveOnlineThrow(); else this.resolveThrow();
          }
        } else if(this.state === 'seagullhit'){
          // Kastet träffade fiskmåsen just denna frame - rita träff-scenen
          // direkt istället för det vanliga kastet.
          this.drawSeagullHitScene();
        }
      } else if(this.state === 'seagullhit'){
        this.updateSeagullHit(dt);
        if(this.state === 'seagullhit') this.drawSeagullHitScene(); // rita om inte animationen redan avslutats denna frame
      } else if(this.state === 'overpower'){
        this.updateOverpower(dt);
        if(this.state === 'overpower') this.drawOverpower(); // rita om inte sekvensen redan avslutats denna frame
      } else if(this.state === 'kingfall'){
        this.updateKingFall(dt);
        if(this.state === 'kingfall') this.drawKingFallScene(); // rita om inte animationen redan avslutats denna frame
      } else if(this.state === 'roundclear'){
        this.drawRoundClear();
      } else if(this.state === 'gameover'){
        this.drawGameOver();
      } else if(this.state === 'nameentry'){
        this.drawNameEntry();
      } else if(this.state === 'highscoreList'){
        this.drawHighscoreList();
      } else if(this.state === 'confirmQuit'){
        this.drawConfirmQuit();
      } else if(this.state === 'roomCodeEntry'){
        this.drawRoomCodeEntry();
      } else if(this.state === 'roomBusy'){
        this.drawRoomBusy();
      } else if(this.state === 'onlineLobby'){
        this.drawOnlineLobby();
      } else if(this.state === 'roomJoinError'){
        this.drawRoomJoinError();
      } else if(this.state === 'onlineWait'){
        if(this.throwAnim){
          this.throwAnim.t += dt; this.throwAnim.rot += dt*30;
          if(this.throwAnim.t >= this.throwAnim.dur) this.throwAnim = null;
        }
        this.drawOnlineWait();
      } else if(this.state === 'onlineRoundResult'){
        this.drawOnlineRoundResult();
      }

      // Efter runda 5 (dvs från runda 6) inverteras hela skärmens färger, som en
      // extra svårighetskrydda. Från runda 10 skiftar färgerna ytterligare ett
      // steg. Görs genom att rita en ruta med "difference"-blend ovanpå allt som
      // redan ritats - en vit ruta ger en ren invertering, en färgad ruta ger en
      // invertering som dessutom är färgskiftad (klassiskt canvas-trick, kräver
      // inget CSS-filter som annars skulle påverka hela devicet, inte bara skärmen).
      if(this.round >= INVERT_FROM_ROUND && this.state !== 'menu' && this.state !== 'highscoreList'){
        ctx.save();
        ctx.globalCompositeOperation = 'difference';
        ctx.fillStyle = this.round >= INVERT_EXTRA_FROM_ROUND ? '#ff00c8' : '#ffffff';
        ctx.fillRect(0,0,W,H);
        ctx.restore();
      }

      if(this.flash>0){
        ctx.fillStyle = 'rgba(255,255,255,'+(this.flash*0.6)+')';
        ctx.fillRect(0,0,W,H);
      }

      ctx.restore();
      requestAnimationFrame(this.loop);
    }
  }

  const kubbGame = new KubbGame(document.getElementById('gameCanvas'));

  // ---- vy-växlare: "DEVICE" (original med Game Boy-skal) / "FULLSCREEN" (bara skärmen) ----
  (function(){
    const VIEW_KEY = 'wiiKubbViewMode';
    const btn = document.getElementById('viewToggle');
    const canvas = document.getElementById('gameCanvas');

    function apply(mode){
      document.body.classList.toggle('fullscreen-mode', mode === 'fullscreen');
      try{ localStorage.setItem(VIEW_KEY, mode); }catch(e){}
      if(btn){
        btn.title = mode === 'fullscreen' ? 'Visa Game Boy (F)' : 'Helskärm, bara skärmen (F)';
      }
    }
    function toggle(){
      const next = document.body.classList.contains('fullscreen-mode') ? 'device' : 'fullscreen';
      apply(next);
    }

    let saved = 'device';
    try{ saved = localStorage.getItem(VIEW_KEY) || 'device'; }catch(e){}
    apply(saved);

    if(btn) btn.addEventListener('click', toggle);
    window.addEventListener('keydown', (e)=>{
      if(e.key === 'f' || e.key === 'F'){ e.preventDefault(); toggle(); }
    });

    // I helskärmsläget finns inga knappar synliga, så ett tryck/klick på
    // själva skärmen fungerar som A-knappen (samma som mellanslag).
    if(canvas){
      canvas.addEventListener('click', ()=>{
        if(document.body.classList.contains('fullscreen-mode')) kubbGame.actionPress();
      });
    }
  })();
})();
</script>

<!--
  ============================================================================
  WiiKubbCloud - Firestore (topplista) + Realtime Database (online-duell).
  Detta är en ES-modul (type="module"), så den laddas asynkront efter det
  klassiska spelskriptet ovan. Den exponerar window.WiiKubbCloud med:
    - submitScore(mode, name, round)   -> Firestore: skickar ett resultat
    - fetchTopScores(mode, topN)       -> Firestore: hämtar topplistan
    - createRoom(onUpdate)             -> RTDB: skapar ett rum, returnerar koden
    - joinRoom(code, onUpdate)         -> RTDB: går med i ett rum
    - updateRoom(code, updates)        -> RTDB: skriver spelstatus till rummet
    - deleteRoom(code)                 -> RTDB: tar bort ett övergivet väntrum
    - unsubscribeRoom()                -> RTDB: kopplar från lyssnaren
  samt skickar ut ett 'wiikubb-cloud-ready'-event när allt är klart, så att
  spelet kan göra om en misslyckad hämtning så fort anslutningen finns.

  VIKTIGT - du måste göra detta i Firebase-konsolen innan allt fungerar:
  1. Slå på Firestore Database (Native mode) för topplistan.
  2. Slå på Realtime Database för online-duellen, och klistra in den riktiga
     databas-URL:en nedan (byt ut TODO-raden) - se mitt svar i chatten.
  3. Sätt säkerhetsregler för BÅDA produkterna. Se förslag i chatten - jag kan
     inte sätta detta åt dig eftersom det görs i Firebase-konsolen, inte här.
  ============================================================================
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
  import {
    getFirestore, collection, addDoc, query, where, orderBy, limit, getDocs, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
  import {
    getDatabase, ref, set, get, update, onValue, off, runTransaction, onDisconnect
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyBJ5TLp_W-g_3GcyHJDTUs6Bao_ST05wvQ",
    authDomain: "wii-kubb.firebaseapp.com",
    projectId: "wii-kubb",
    storageBucket: "wii-kubb.firebasestorage.app",
    messagingSenderId: "537067638054",
    appId: "1:537067638054:web:2acea8e9edc0301a37c5e7",
    measurementId: "G-RTBP3TVBJ7",
    // TODO: byt ut mot din riktiga Realtime Database-URL. Den visas i
    // Firebase-konsolen (Build -> Realtime Database) när du skapar databasen,
    // och ser ut ungefär så här: "https://wii-kubb-default-rtdb.<region>.firebasedatabase.app"
    databaseURL: "https://wii-kubb-default-rtdb.europe-west1.firebasedatabase.app"
  };

  const app = initializeApp(firebaseConfig);
  // Analytics kan misslyckas tyst (t.ex. om en adblocker stoppar den) -
  // det ska aldrig hindra själva spelet, topplistan eller online-duellen.
  try{ getAnalytics(app); }catch(e){ console.warn('Firebase Analytics kunde inte starta:', e); }

  const db = getFirestore(app);
  const SCORES_COLLECTION = 'scores';
  const VALID_MODES = new Set(['classic', 'timeattack']);

  async function submitScore(mode, name, round){
    if(!VALID_MODES.has(mode)) return false;
    const cleanName = String(name || 'SPELARE').slice(0, 8);
    const cleanRound = Math.max(0, Math.min(999, Math.floor(Number(round) || 0)));
    try{
      await addDoc(collection(db, SCORES_COLLECTION), {
        mode,
        name: cleanName,
        round: cleanRound,
        createdAt: serverTimestamp()
      });
      return true;
    }catch(err){
      console.error('WiiKubbCloud: kunde inte spara resultat', err);
      return false;
    }
  }

  async function fetchTopScores(mode, topN){
    if(!VALID_MODES.has(mode)) return [];
    topN = Math.max(1, Math.min(25, topN || 10));
    try{
      const q = query(
        collection(db, SCORES_COLLECTION),
        where('mode', '==', mode),
        orderBy('round', 'desc'),
        limit(topN)
      );
      const snap = await getDocs(q);
      const out = [];
      snap.forEach(docSnap=>{
        const d = docSnap.data();
        out.push({
          name: String(d.name || '???').slice(0, 8),
          round: typeof d.round === 'number' ? d.round : 0
        });
      });
      return out;
    }catch(err){
      // Vanligast: nätet är nere, eller Firestore-regler/index saknas ännu.
      console.error('WiiKubbCloud: kunde inte hämta topplista', err);
      return null; // null = fel (spelet faller tillbaka på den lokala listan)
    }
  }

  // ---- Realtime Database: online-duell (rum, drag, delad ställning) ----
  const rtdb = getDatabase(app);
  const ROOM_CODE_CHARSET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // O/0, I/1 uteslutna - lätt att förväxla
  const ROOM_CODE_LEN = 4;
  let activeRoomCode = null;
  let activeRoomRef = null;
  let activeRoomCallback = null;

  function generateRoomCode(){
    let code = '';
    for(let i=0;i<ROOM_CODE_LEN;i++) code += ROOM_CODE_CHARSET[Math.floor(Math.random()*ROOM_CODE_CHARSET.length)];
    return code;
  }

  function subscribeRoom(code, onUpdate){
    unsubscribeRoom();
    activeRoomCode = code;
    activeRoomRef = ref(rtdb, 'rooms/'+code);
    activeRoomCallback = onValue(activeRoomRef, (snap)=>{ onUpdate(snap.val()); });
  }
  function unsubscribeRoom(){
    if(activeRoomRef) off(activeRoomRef);
    activeRoomCode = null; activeRoomRef = null; activeRoomCallback = null;
  }

  // Försöker några gånger med nya slumpade koder ifall en kollision skulle
  // inträffa (osannolikt med 4 tecken ur en 33-teckenuppsättning, men billigt
  // att skydda sig mot).
  async function createRoom(onUpdate){
    for(let attempt=0; attempt<6; attempt++){
      const code = generateRoomCode();
      const roomRef = ref(rtdb, 'rooms/'+code);
      try{
        const snap = await get(roomRef);
        if(snap.exists()) continue;
        await set(roomRef, {
          code,
          createdAt: Date.now(),
          status: 'waiting',
          turn: 'player1',
          phase: 'kubbs',
          kubbs: [true,true,true,true,true],
          batonsLeft: 8,
          kingFallen: false,
          winner: null,
          message: '',
          messageAt: 0,
          lastThrow: null,
          player1Present: true,
          player2Present: false,
          player1Connected: true,
          player2Connected: true,
          updatedAt: Date.now()
        });
        // Best-effort: om värden stänger fliken/tappar nätet markeras hen
        // som frånkopplad så motståndaren kan se det (se drawHUD).
        onDisconnect(ref(rtdb, 'rooms/'+code+'/player1Connected')).set(false);
        subscribeRoom(code, onUpdate);
        return code;
      }catch(err){
        console.error('WiiKubbCloud: kunde inte skapa rum', err);
        return null;
      }
    }
    return null; // gav upp efter flera kollisioner - extremt osannolikt
  }

  // Atomär "gå med"-transaktion: garanterar att bara EN spelare kan ta
  // player2-platsen, även om två personer skulle råka trycka samtidigt.
  async function joinRoom(code, onUpdate){
    code = String(code||'').toUpperCase();
    const roomRef = ref(rtdb, 'rooms/'+code);
    try{
      const result = await runTransaction(roomRef, (room)=>{
        // VIKTIGT: update-funktionen kan anropas första gången med room===null
        // enbart för att klienten ännu inte hunnit hämta den riktiga datan från
        // servern - det betyder INTE nödvändigtvis att rummet saknas. Om vi
        // avbryter direkt här (return undefined) hinner Firebase aldrig
        // kontrollera med servern, och ett rum som faktiskt finns (och inte
        // är fullt) skulle felaktigt rapporteras som "fullt". Genom att
        // returnera null (inte undefined) låter vi transaktionen synka med
        // servern och köra om funktionen med den riktiga datan om sådan finns.
        if(room === null) return null;
        if(room.player2Present) return undefined; // riktig data, redan upptaget -> avbryt
        room.player2Present = true;
        room.player2Connected = true;
        room.status = 'playing';
        room.updatedAt = Date.now();
        return room;
      });
      if(!result.committed){
        // Enda sättet detta händer nu (givet ovanstående) är att den riktiga
        // datan visade att player2Present redan var true.
        return 'full';
      }
      if(result.snapshot.val() === null){
        // Transaktionen gick igenom och bekräftade med servern att rummet
        // verkligen inte finns (skrev null -> no-op).
        return 'notfound';
      }
      onDisconnect(ref(rtdb, 'rooms/'+code+'/player2Connected')).set(false);
      subscribeRoom(code, onUpdate);
      return 'ok';
    }catch(err){
      console.error('WiiKubbCloud: kunde inte gå med i rum', err);
      return 'error';
    }
  }

  async function updateRoom(code, updates){
    try{ await update(ref(rtdb, 'rooms/'+code), updates); return true; }
    catch(err){ console.error('WiiKubbCloud: kunde inte uppdatera rum', err); return false; }
  }
  async function deleteRoom(code){
    try{ await set(ref(rtdb, 'rooms/'+code), null); return true; }
    catch(err){ console.error('WiiKubbCloud: kunde inte ta bort rum', err); return false; }
  }

  window.WiiKubbCloud = {
    submitScore, fetchTopScores,
    createRoom, joinRoom, updateRoom, deleteRoom, unsubscribeRoom,
    ready: true
  };
  window.dispatchEvent(new Event('wiikubb-cloud-ready'));
</script>
